<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time Logger — Logo directions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --acc-h: 35;
    --accent: oklch(0.72 0.17 var(--acc-h));
    --accent-strong: oklch(0.66 0.19 var(--acc-h));
    --accent-fg: #1a1407;
    --bg: #0a0b0d;
    --panel: #14171c;
    --panel-2: #191d23;
    --border: rgba(255,255,255,0.08);
    --border-2: rgba(255,255,255,0.14);
    --text: #e8ebef;
    --muted: #7a8390;
    --font-ui: "Inter", -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  .logo-card {
    width: 100%; height: 100%;
    background: var(--panel);
    border-radius: 14px;
    padding: 28px 24px 20px;
    display: flex; flex-direction: column; gap: 18px;
    box-sizing: border-box;
  }
  .logo-card.dark { background: #0f1114; }
  .logo-card.light { background: #f4f2ee; color: #17181b; }
  .logo-card.tint { background: var(--accent); color: var(--accent-fg); }
  .logo-stage {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: rgba(255,255,255,0.025);
    border: 1px dashed rgba(255,255,255,0.08);
    position: relative;
  }
  .logo-card.light .logo-stage { background: rgba(0,0,0,0.025); border-color: rgba(0,0,0,0.08); }
  .logo-card.tint .logo-stage { background: rgba(0,0,0,0.12); border-color: rgba(0,0,0,0.18); }
  .lockup {
    display: flex; align-items: center; gap: 14px;
    font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
  }
  .lockup .tiny { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; margin-left: 6px; }
  .logo-card.light .lockup .tiny { color: #6b7280; }
  .logo-card.tint .lockup .tiny { color: rgba(26,20,7,0.7); }
  .meta {
    display: flex; flex-direction: column; gap: 4px;
  }
  .meta-name { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
  .meta-blurb { font-size: 12px; color: var(--muted); }
  .logo-card.light .meta-blurb { color: #6b7280; }
  .logo-card.tint .meta-blurb { color: rgba(26,20,7,0.7); }
  .size-row {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
  }
  .logo-card.light .size-row { border-color: rgba(0,0,0,0.06); color: #6b7280; }
  .logo-card.tint .size-row { border-color: rgba(0,0,0,0.12); color: rgba(26,20,7,0.65); }
  .size-row > div { display: flex; align-items: center; gap: 10px; }
  /* favicon-style preview */
  .fav {
    width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .note {
    padding: 20px 24px;
    color: var(--muted); font-size: 13px;
    max-width: 720px; line-height: 1.6;
  }
  .note strong { color: var(--text); font-weight: 600; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="day-v2-logos.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
  /* global React, ReactDOM, LOGOS, DesignCanvas, DCSection, DCArtboard */

  const LogoCard = ({ id, theme = "dark" }) => {
    const entry = LOGOS[id];
    const Mark = entry.Mark;
    return (
      <div className={`logo-card ${theme}`}>
        <div className="meta">
          <div className="meta-name">{entry.name}</div>
          <div className="meta-blurb">{entry.blurb}</div>
        </div>
        <div className="logo-stage">
          <div className="lockup">
            <Mark size={44} />
            <span>Time Logger</span>
          </div>
        </div>
        <div className="size-row">
          <div>
            <span className="fav"><Mark size={16}/></span>
            <span className="fav"><Mark size={20}/></span>
            <span className="fav" style={{width:24,height:24}}><Mark size={24}/></span>
            <span className="fav" style={{width:32,height:32}}><Mark size={32}/></span>
          </div>
          <div>{id}.svg</div>
        </div>
      </div>
    );
  };

  const ids = ["stack","arc","mono","clock","hourglass","carve"];

  const App = () => (
    <>
      <div className="note">
        <strong>Six logo directions for Time Logger.</strong> Each rendered at 44px alongside the wordmark,
        plus 16/20/24/32px in the footer to sanity-check favicon scale. Shown on dark, light, and accent-tinted
        backgrounds. Pick a direction (or hybrid) and I'll wire it into the app.
      </div>
      <DesignCanvas initialZoom={0.7} bg="#0a0b0d">
        <DCSection id="dark" title="On dark (default theme)">
          {ids.map(id => (
            <DCArtboard key={id} id={`dark-${id}`} label={LOGOS[id].name} width={380} height={300}>
              <LogoCard id={id} theme="dark" />
            </DCArtboard>
          ))}
        </DCSection>
        <DCSection id="light" title="On light">
          {ids.map(id => (
            <DCArtboard key={id} id={`light-${id}`} label={LOGOS[id].name} width={380} height={300}>
              <LogoCard id={id} theme="light" />
            </DCArtboard>
          ))}
        </DCSection>
        <DCSection id="tint" title="On accent (for app icon / splash)">
          {ids.map(id => (
            <DCArtboard key={id} id={`tint-${id}`} label={LOGOS[id].name} width={380} height={300}>
              <LogoCard id={id} theme="tint" />
            </DCArtboard>
          ))}
        </DCSection>
      </DesignCanvas>
    </>
  );

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
